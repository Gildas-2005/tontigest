# TontiGest — configuration de déploiement Render (web service)
# Plan gratuit : le service s'endort après 15 min d'inactivité,
# le premier clic le réveille en ~30s. Astuce anti-sommeil : cron-job.org
# qui appelle /api/health toutes les 10 minutes (voir DEPLOIEMENT.md).
#
# BASE DE DONNÉES : Render ne propose plus de MySQL managé.
# Le serveur se connecte via DB_HOST/DB_USER/DB_PASSWORD/DB_NAME (env vars),
# définis dans le dashboard Render — par exemple vers une base MySQL gratuite
# externe (TiDB Cloud Serverless : 5 Go gratuits, protocole MySQL) ou tout
# autre MySQL accessible sur Internet.

services:
  - type: web
    name: tontigest
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # --- Base MySQL externe (renseigner dans le dashboard) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"   # 4000 pour TiDB Cloud Serverless
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # --- Sécurité ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      # --- Superadmin ---
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # --- GeniusPay (sandbox pour les tests en ligne) ---
      - key: GENIUSPAY_PUBLIC_KEY
        sync: false
      - key: GENIUSPAY_SECRET_KEY
        sync: false
      - key: GENIUSPAY_BASE_URL
        value: https://geniuspay.ci/api/v1/merchant
      - key: GENIUSPAY_SANDBOX
        value: "true"
      # --- Mailjet ---
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_SENDER_EMAIL
        sync: false
      - key: MAILJET_SENDER_NAME
        value: TontiGest
