# TontiGest — configuration de déploiement Render
# Stack : web service Node (free) + PostgreSQL managé (free).
#
# La base Render Postgres expose DATABASE_URL — le serveur (server/db.js)
# détecte DB_CLIENT=pg / DATABASE_URL et bascule automatiquement sur le
# driver PostgreSQL avec TLS. Le schéma est appliqué au démarrage.
#
# Plan gratuit : le service s'endort après 15 min d'inactivité,
# le premier clic le réveille en ~30s. Astuce anti-sommeil : cron-job.org
# qui appelle /api/health toutes les 10 minutes (voir DEPLOIEMENT.md).

databases:
  - name: tontigest-db
    databaseName: tontigest
    user: tontigest
    plan: free
    region: frankfurt

services:
  - type: web
    name: tontigest
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # --- PostgreSQL (DATABASE_URL injecté par Render) ---
      - key: DATABASE_URL
        fromDatabase:
          name: tontigest-db
          property: connectionString
      - key: DB_CLIENT
        value: pg
      # --- Sécurité ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      # --- Superadmin ---
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # --- GeniusPay (sandbox pour les tests en ligne) ---
      - key: GENIUSPAY_PUBLIC_KEY
        sync: false
      - key: GENIUSPAY_SECRET_KEY
        sync: false
      - key: GENIUSPAY_BASE_URL
        value: https://geniuspay.ci/api/v1/merchant
      - key: GENIUSPAY_SANDBOX
        value: "true"
      # --- Mailjet ---
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_SENDER_EMAIL
        sync: false
      - key: MAILJET_SENDER_NAME
        value: TontiGest
